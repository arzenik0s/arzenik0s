name: Work Stats Readme

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"

jobs:
  update-readme:
    name: Update XP.track()
    runs-on: ubuntu-latest

    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

          SHOW_TITLE: false
          TIME_RANGE: all_time
          CODE_LANG: txt
          BLOCKS: ⣀⣄⣤⣦⣶⣷⣿

          SHOW_TIME: true
          SHOW_TOTAL: true
          SHOW_MASKED_TIME: true

          LANG_COUNT: 5

          COMMIT_MESSAGE: "XP.track() (docs): update waka-readme graph with new metrics"
