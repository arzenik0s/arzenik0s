name: Waka Readme

on:
  push:
    branches:
      - main

jobs:
  update-readme:
    name: Update XP.track()
    runs-on: ubuntu-latest

    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

          SHOW_TITLE: false
          INPUT_SHOW_UPDATED_DATE: true
          TIME_RANGE: all_time
          CODE_LANG: txt
          BLOCKS: ⣀⣄⣤⣦⣶⣷⣿

          SHOW_TIME: true
          SHOW_TOTAL: true
          SHOW_MASKED_TIME: true

          INPUT_SHOW_LANGUAGE: true
          LANG_COUNT: 5

          INPUT_SHOW_PROJECTS: true

          INPUT_SHOW_PROFILE_VIEWS: true

          LANG_SORT_BY: time
          PROJECT_SORT_BY: time

          COMMIT_MESSAGE: "XP.track() (docs): update waka-readme graph with new metrics"
